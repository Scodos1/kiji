services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiji
      POSTGRES_USER: kiji
      POSTGRES_PASSWORD: kiji
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiji"]
      interval: 5s

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: development
      SECRET_KEY: dev-key
      DATABASE_URL: postgres://kiji:kiji@db:5432/kiji
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [./backend:/app/backend]

volumes:
  pgdata:
