services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.db
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiji}"]
      interval: 5s

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports: ["8000:8000"]
    volumes: [./backend:/app/backend]

volumes:
  pgdata:
